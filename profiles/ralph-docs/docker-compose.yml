name: ralph-sandbox

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 1433
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
      ADO_PAT_XPERIENCE: "${ADO_PAT_XPERIENCE}"
    shm_size: 2gb
    volumes:
      # Target repo workspace
      - ${TARGET_REPO_PATH}:/workspace
    command: sleep infinity
    depends_on:
      - db
    networks:
      ralph-internal:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_PID: developer
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
    expose:
      - "1433"
    volumes:
      - sqlserver-ralph-data:/var/opt/mssql
    networks:
      ralph-internal:
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT @@VERSION" || exit 1
      interval: 60s
      timeout: 3s
      retries: 10
      start_period: 60s

volumes:
  sqlserver-ralph-data:

networks:
  ralph-internal:
    internal: true
  ralph-external:
    driver: bridge
