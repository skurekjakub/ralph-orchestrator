name: ralph-sandbox

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 1433
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
      GH_TOKEN: "${GH_TOKEN}"
      ADO_PAT_DOCS: "${ADO_PAT_DOCS}"
      ADO_MCP_AUTH_TOKEN: "${ADO_PAT_DOCS}"
      ADO_PAT_XPERIENCE: "${ADO_PAT_XPERIENCE}"
      JIRA_PAT: "${JIRA_PAT}"
      JIRA_EMAIL: "${JIRA_EMAIL}"
      JIRA_BASE_URL: "${JIRA_BASE_URL}"
      JIRA_CLOUD_ID: "${JIRA_CLOUD_ID}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      CLAUDE_CODE_DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_COST_WARNINGS: "1"
    shm_size: 2gb
    volumes:
      # Target repo workspace
      - ${TARGET_REPO_PATH}:/workspace
      # Ralph agent definitions (resolved from templates by the orchestrator)
      - ./agents/.build/ralph.ralph.agent.md:/workspace/.github/agents/ralph.ralph.agent.md:ro
      - ./agents/.build/ralph.ralph-researcher.agent.md:/workspace/.github/agents/ralph.ralph-researcher.agent.md:ro
      - ./agents/.build/ralph.ralph-reviewer.agent.md:/workspace/.github/agents/ralph.ralph-reviewer.agent.md:ro
      - ./agents/.build/ralph.malph.agent.md:/workspace/.github/agents/ralph.malph.agent.md:ro
      - ./agents/.build/ralph.malph-investigator.agent.md:/workspace/.github/agents/ralph.malph-investigator.agent.md:ro
      # Ralph resource files - mounted to gitignored folder
      - ./resources/ralph-revisions.md:/workspace/resources/chats/ralph-revisions.md:ro
      # Shared hook scripts + audit config
      - ${SHARED_HOOKS_PATH}:/workspace/.ralph/hooks:ro
      - ${SHARED_HOOKS_PATH}/ralph-audit.json:/workspace/.github/hooks/ralph-audit.json:ro
    command: sleep infinity
    depends_on:
      - db
    networks:
      ralph-internal:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_PID: developer
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
    expose:
      - "1433"
    volumes:
      - sqlserver-ralph-data:/var/opt/mssql
    networks:
      ralph-internal:
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT @@VERSION" || exit 1
      interval: 60s
      timeout: 3s
      retries: 10
      start_period: 60s

volumes:
  sqlserver-ralph-data:

networks:
  ralph-internal:
    internal: true
  ralph-external:
    driver: bridge
