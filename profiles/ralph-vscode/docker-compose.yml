name: ralph-sandbox-vscode

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: 1gb
    volumes:
      # Target repo workspace
      - ${TARGET_REPO_PATH}:/workspace
      # Ralph agent definitions (resolved from templates by the orchestrator)
      - ./.build/ralph.ralph.agent.md:/workspace/.github/agents/ralph.ralph.agent.md:ro
      - ./.build/ralph.ralph-analyst.agent.md:/workspace/.github/agents/ralph.analyst.agent.md:ro
      - ./.build/ralph.malph.agent.md:/workspace/.github/agents/ralph.malph.agent.md:ro
    command: sleep infinity
    networks:
      ralph-internal:

networks:
  ralph-internal:
    internal: true
  ralph-external:
    driver: bridge
