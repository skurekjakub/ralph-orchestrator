name: ralph-sandbox-vscode

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: 1gb
    volumes:
      # Target repo workspace
      - ${TARGET_REPO_PATH}:/workspace
    command: sleep infinity
    networks:
      ralph-internal:

networks:
  ralph-internal:
    internal: true
  ralph-external:
    driver: bridge
