name: ralph-sandbox-vscode

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GH_TOKEN: "${GH_TOKEN}"
      ADO_PAT_DOCS: "${ADO_PAT_DOCS}"
      ADO_MCP_AUTH_TOKEN: "${ADO_PAT_DOCS}"
      JIRA_PAT: "${JIRA_PAT}"
      JIRA_EMAIL: "${JIRA_EMAIL}"
      JIRA_BASE_URL: "${JIRA_BASE_URL}"
      JIRA_CLOUD_ID: "${JIRA_CLOUD_ID}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      CLAUDE_CODE_DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_COST_WARNINGS: "1"
    shm_size: 1gb
    volumes:
      # Target repo workspace
      - ${TARGET_REPO_PATH}:/workspace
      # Ralph agent definitions (resolved from templates by the orchestrator)
      - ./agents/.build/ralph.ralph.agent.md:/workspace/.github/agents/ralph.ralph.agent.md:ro
      - ./agents/.build/ralph.ralph-analyst.agent.md:/workspace/.github/agents/ralph.analyst.agent.md:ro
      - ./agents/.build/ralph.malph.agent.md:/workspace/.github/agents/ralph.malph.agent.md:ro
    command: sleep infinity
    networks:
      ralph-internal:

networks:
  ralph-internal:
    internal: true
  ralph-external:
    driver: bridge
