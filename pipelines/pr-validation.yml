trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1
    inputs:
      version: "22.x"
    displayName: Use Node.js 22.x

  - script: npm ci
    displayName: Install dependencies

  - script: npm run lint
    displayName: Type-check (tsc --noEmit)

  - script: npm test
    displayName: Run tests

  - script: npm run build
    displayName: Build
