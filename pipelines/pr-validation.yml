trigger: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Orchestrator
    displayName: Orchestrator
    jobs:
      - job: OrchestratorValidation
        displayName: Lint, Test & Build
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node.js 22.x

          - script: npm ci
            displayName: Install dependencies

          - script: npm run lint
            displayName: Type-check (tsc --noEmit)

          - script: npx vitest run
            displayName: Run tests

          - script: npm run build
            displayName: Build

  - stage: McpServers
    displayName: MCP Servers
    dependsOn: []
    jobs:
      - job: McpServer
        displayName: "MCP: $(serverName)"
        strategy:
          matrix:
            ado:
              serverDir: shared/mcp-servers/ado
              serverName: ADO
            discord-hitl:
              serverDir: shared/mcp-servers/discord-hitl
              serverName: Discord HITL
            jira-kentico:
              serverDir: shared/mcp-servers/jira-kentico
              serverName: JIRA Kentico
            microsoft-docs:
              serverDir: shared/mcp-servers/microsoft-docs
              serverName: Microsoft Docs
            web-fetch:
              serverDir: shared/mcp-servers/web-fetch
              serverName: Web Fetch
            ralphchives-read:
              serverDir: shared/mcp-servers/ralphchives-read
              serverName: Ralphchives Read
            ralphchives-write:
              serverDir: shared/mcp-servers/ralphchives-write
              serverName: Ralphchives Write
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node.js 22.x

          - script: npm ci
            workingDirectory: $(serverDir)
            displayName: Install dependencies

          - script: npm run lint
            workingDirectory: $(serverDir)
            displayName: Type-check (tsc --noEmit)

          - script: |
              if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
                npm test
              else
                echo "No test script — skipping"
              fi
            workingDirectory: $(serverDir)
            displayName: Run tests (if available)

          - script: npm run build
            workingDirectory: $(serverDir)
            displayName: Build

  - stage: Dashboards
    displayName: Dashboards
    dependsOn: []
    jobs:
      - job: DashboardLocal
        displayName: Local Dashboard — Lint & Build
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node.js 22.x

          - script: npm ci
            workingDirectory: dashboard-local
            displayName: Install dependencies

          - script: npm run lint
            workingDirectory: dashboard-local
            displayName: Type-check (tsc --noEmit)

          - script: npm run build
            workingDirectory: dashboard-local
            displayName: Build (vite)

      - job: DashboardVercel
        displayName: Vercel Dashboard — Lint & Build
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node.js 22.x

          - script: npm ci
            workingDirectory: ralph-dashboard
            displayName: Install dependencies

          - script: npm run lint
            workingDirectory: ralph-dashboard
            displayName: Type-check (tsc --noEmit)

          - script: npm run build
            workingDirectory: ralph-dashboard
            displayName: Build (next)

  - stage: Ralphchives
    displayName: Ralphchives
    dependsOn: []
    jobs:
      - job: RalphchivesSync
        displayName: Ralphchives Sync — Lint, Test & Build
        steps:
          - task: UseNode@1
            inputs:
              version: "22.x"
            displayName: Use Node.js 22.x

          - script: npm ci
            workingDirectory: ralphchives/sync
            displayName: Install dependencies

          - script: npx tsc --noEmit
            workingDirectory: ralphchives/sync
            displayName: Type-check (tsc --noEmit)

          - script: npx vitest run
            workingDirectory: ralphchives/sync
            displayName: Run tests

          - script: npm run build
            workingDirectory: ralphchives/sync
            displayName: Build
