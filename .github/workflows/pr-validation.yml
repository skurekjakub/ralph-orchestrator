name: PR Validation

on:
  pull_request:

jobs:
  orchestrator:
    name: Lint, Test & Build
    runs-on: satriel-ralph
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  mcp-servers:
    name: "MCP: ${{ matrix.serverName }}"
    runs-on: satriel-ralph
    strategy:
      matrix:
        include:
          - serverDir: shared/mcp-servers/ado
            serverName: ADO
          - serverDir: shared/mcp-servers/discord-hitl
            serverName: Discord HITL
          - serverDir: shared/mcp-servers/jira-kentico
            serverName: JIRA Kentico
          - serverDir: shared/mcp-servers/microsoft-docs
            serverName: Microsoft Docs
          - serverDir: shared/mcp-servers/web-fetch
            serverName: Web Fetch
          - serverDir: shared/mcp-servers/ralphchives-read
            serverName: Ralphchives read
          - serverDir: shared/mcp-servers/ralphchives-write
            serverName: Ralphchives write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.serverDir }}

      - name: Type-check (tsc --noEmit)
        run: npm run lint
        working-directory: ${{ matrix.serverDir }}

      - name: Run tests (if available)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script — skipping"
          fi
        working-directory: ${{ matrix.serverDir }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.serverDir }}

  dashboard-local:
    name: Local Dashboard — Lint & Build
    runs-on: satriel-ralph
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard-local

      - name: Type-check (tsc --noEmit)
        run: npm run lint
        working-directory: dashboard-local

      - name: Build (vite)
        run: npm run build
        working-directory: dashboard-local

  dashboard-vercel:
    name: Vercel Dashboard — Lint & Build
    runs-on: satriel-ralph
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        working-directory: ralph-dashboard

      - name: Type-check (tsc --noEmit)
        run: npm run lint
        working-directory: ralph-dashboard

      - name: Build (next)
        run: npm run build
        working-directory: ralph-dashboard

  ralphchives-sync:
    name: Ralphchives Sync — Lint, Test & Build
    runs-on: satriel-ralph
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        working-directory: ralphchives/sync

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: ralphchives/sync

      - name: Run tests
        run: npx vitest run
        working-directory: ralphchives/sync

      - name: Build
        run: npm run build
        working-directory: ralphchives/sync

  ralphchives-integration:
    name: Ralphchives Integration Tests
    runs-on: satriel-ralph
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Ensure Docker is available
        run: |
          if ! command -v docker &>/dev/null; then
            echo "::error::Docker is not installed on this runner"
            exit 1
          fi
          docker compose version

      - name: Start NodeBB + MongoDB
        run: docker compose -f ralphchives/docker-compose.ci.yml up -d --wait --wait-timeout 300

      - name: Seed test data
        id: seed
        run: |
          node ralphchives/scripts/seed-test-data.mjs > /tmp/seed-env.txt
          cat /tmp/seed-env.txt >> "$GITHUB_ENV"

      - name: Install ralphchives-read dependencies
        run: npm ci
        working-directory: shared/mcp-servers/ralphchives-read

      - name: Run ralphchives-read integration tests
        run: npx vitest run tests/search-integration.test.ts
        working-directory: shared/mcp-servers/ralphchives-read
        env:
          NODEBB_API_TOKEN: ${{ env.NODEBB_API_TOKEN }}
          NODEBB_CATEGORY_ID: ${{ env.NODEBB_CATEGORY_ID }}
          NODEBB_API_URL: ${{ env.NODEBB_API_URL }}

      - name: Install ralphchives-write dependencies
        run: npm ci
        working-directory: shared/mcp-servers/ralphchives-write

      - name: Run ralphchives-write integration tests
        run: npx vitest run tests/write-integration.test.ts
        working-directory: shared/mcp-servers/ralphchives-write
        env:
          NODEBB_API_TOKEN: ${{ env.NODEBB_API_TOKEN }}
          NODEBB_CATEGORY_ID: ${{ env.NODEBB_CATEGORY_ID }}
          NODEBB_API_URL: ${{ env.NODEBB_API_URL }}

      - name: Teardown NodeBB
        if: always()
        run: docker compose -f ralphchives/docker-compose.ci.yml down --volumes --remove-orphans
