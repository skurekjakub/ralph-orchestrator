# Squid Proxy — Domain Allowlist Configuration
#
# This proxy runs as a sidecar container and enforces a domain allowlist
# for all outbound HTTP/HTTPS traffic from the agent container.
#
# The agent container is on an internal-only Docker network with no direct
# internet access. All traffic must go through this proxy.

# Listen on port 3128
http_port 3128

# ---------------------------------------------------------------------------
# Domain allowlist
# ---------------------------------------------------------------------------

# AI/LLM backends
acl allowed_domains dstdomain .githubcopilot.com
acl allowed_domains dstdomain api.github.com
acl allowed_domains dstdomain github.com
acl allowed_domains dstdomain .anthropic.com

# Azure infrastructure (CLI extensions, blob storage)
acl allowed_domains dstdomain aka.ms

# Azure DevOps — NuGet feeds and build artifact downloads
acl allowed_domains dstdomain pkgs.dev.azure.com
acl allowed_domains dstdomain dev.azure.com
acl allowed_domains dstdomain vsblob.dev.azure.com
acl allowed_domains dstdomain .artifacts.visualstudio.com

# Package registries
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .rubygems.org
acl allowed_domains dstdomain .nuget.org
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org

# ---------------------------------------------------------------------------
# Host loopback access (host.docker.internal)
# ---------------------------------------------------------------------------
# Allow the agent to reach specific ports on the host machine via
# host.docker.internal. Add ports as needed for RAG endpoints, local
# dev servers, etc. Only HTTP/HTTPS traffic is supported (Squid limitation).

acl host_loopback dstdomain host.docker.internal
# Hosts the RAG endpoint for `consult_ralphchives`
acl host_loopback_ports port 4500

http_access allow host_loopback host_loopback_ports
http_access deny host_loopback

# ---------------------------------------------------------------------------
# Port rules
# ---------------------------------------------------------------------------

acl Safe_ports port 80
acl Safe_ports port 443
acl SSL_ports port 443
acl CONNECT method CONNECT

# Deny non-standard ports
http_access deny !Safe_ports

# Only allow CONNECT (HTTPS tunneling) to port 443
http_access deny CONNECT !SSL_ports

# ---------------------------------------------------------------------------
# Access control
# ---------------------------------------------------------------------------

# Allow traffic to whitelisted domains only
http_access allow allowed_domains

# Deny everything else
http_access deny all

# ---------------------------------------------------------------------------
# Logging & tuning
# ---------------------------------------------------------------------------

# Use default log paths (/var/log/squid/) — the ubuntu/squid entrypoint
# forwards these to stdout via tail -F
coredump_dir /var/spool/squid

# Disable caching (we're a forward proxy, not a cache)
cache deny all

# Suppress Squid version in error pages
httpd_suppress_version_string on
forwarded_for delete
